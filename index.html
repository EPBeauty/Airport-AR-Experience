<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airport Security AR Guide</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-green: #34C759;
            --light-gray: #D9D9D9;
            --black: #000000;
            --white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            color: var(--black);
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: transparent;
        }
        
        .instructions-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            z-index: 100;
            text-align: center;
        }
        
        .instructions-panel h2 {
            margin-top: 0;
            color: var(--black);
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .instructions-panel p {
            color: var(--black);
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 400;
        }
        
        .item-selection {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.7);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            backdrop-filter: blur(5px);
        }
        
        .item-button {
            background-color: var(--white);
            border-radius: 10px;
            border: none;
            padding: 10px;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }
        
        .item-button img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        
        .item-button span {
            margin-top: 5px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tray-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 40%;
            border: 3px dashed #34C759;
            border-radius: 10px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.3);
        }
        
        .next-tray-button {
            position: absolute;
            bottom: 120px;
            right: 20px;
            background-color: var(--primary-green);
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            z-index: 100;
        }
        
        .tray-mode {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(52, 199, 89, 0.9);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 100;
            text-align: center;
        }
        
        .item-in-tray {
            position: absolute;
            pointer-events: auto;
            z-index: 20;
            transition: transform 0.2s ease;
        }
        
        .item-in-tray img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .reset-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--white);
            color: var(--black);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 150;
        }
    </style>
</head>
<body>
    <!-- Main AR viewer - activated immediately -->
    <model-viewer 
        id="arViewer"
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        interaction-prompt="none"
        shadow-intensity="1"
        autoplay
        environment-image="neutral">
    </model-viewer>
    
    <div class="instructions-panel">
        <h2>Place Items in Security Tray</h2>
        <p>Tap items below to position in your real tray</p>
    </div>
    
    <div class="tray-mode" id="trayMode">
        Regular Items Tray
    </div>
    
    <div class="tray-outline"></div>
    
    <button class="reset-button" id="resetButton">↺</button>
    
    <button class="next-tray-button" id="nextTrayButton">
        Continue to Next Tray
    </button>
    
    <div class="item-selection" id="itemSelection">
        <!-- Items will be populated by JavaScript -->
    </div>
    
    <script>
        // The available items with their size and position settings
        const items = [
            { 
                id: 'bag', 
                name: 'Bag', 
                type: 'other', 
                image: 'bag.png',  // Use images instead of 3D models for simplicity
                width: 120,
                height: 100,
                position: { x: 30, y: 30 }  // Default position in tray (percentage)
            },
            { 
                id: 'phone', 
                name: 'Phone', 
                type: 'other', 
                image: 'phone.png',
                width: 40,
                height: 80,
                position: { x: 50, y: 40 }
            },
            { 
                id: 'keys', 
                name: 'Keys', 
                type: 'other', 
                image: 'keys.png',
                width: 60,
                height: 40,
                position: { x: 70, y: 30 }
            },
            { 
                id: 'laptop', 
                name: 'Laptop', 
                type: 'laptop', 
                image: 'laptop.png',
                width: 140,
                height: 100,
                position: { x: 50, y: 50 }
            },
            { 
                id: 'watch', 
                name: 'Watch', 
                type: 'other', 
                image: 'watch.png',
                width: 50,
                height: 50,
                position: { x: 80, y: 70 }
            },
            { 
                id: 'wallet', 
                name: 'Wallet', 
                type: 'other', 
                image: 'wallet.png',
                width: 70,
                height: 50,
                position: { x: 40, y: 70 }
            }
        ];
        
        // Current tray mode - start with regular items
        let currentTrayMode = 'other';
        
        // Keep track of items in each tray
        const itemsInTray = {
            laptop: [],
            other: []
        };
        
        // DOM references
        const itemSelection = document.getElementById('itemSelection');
        const trayMode = document.getElementById('trayMode');
        const resetButton = document.getElementById('resetButton');
        const nextTrayButton = document.getElementById('nextTrayButton');
        const arViewer = document.getElementById('arViewer');
        const trayOutline = document.querySelector('.tray-outline');
        
        // Initialize by loading camera view immediately
        function initializeApp() {
            // Show tray type indicator
            updateTrayModeDisplay();
            
            // Start AR immediately
            startARExperience();
            
            // Populate item selection
            populateItemSelection();
            
            // Set up event listeners
            resetButton.addEventListener('click', resetTray);
            nextTrayButton.addEventListener('click', switchTrayMode);
            
            // Hide next tray button initially (show when items are placed)
            nextTrayButton.style.display = 'none';
        }
        
        // Update the tray mode display
        function updateTrayModeDisplay() {
            if (currentTrayMode === 'laptop') {
                trayMode.textContent = 'Laptop Tray';
            } else {
                trayMode.textContent = 'Regular Items Tray';
            }
        }
        
        // Start AR experience immediately
        function startARExperience() {
            // Find and click the AR button to activate camera
            setTimeout(() => {
                const arButton = document.querySelector('button[slot="ar-button"]');
                if (arButton) {
                    arButton.click();
                }
            }, 500);
        }
        
        // Populate the item selection bar
        function populateItemSelection() {
            // Clear previous items
            itemSelection.innerHTML = '';
            
            // Filter items by current tray mode
            const currentItems = items.filter(item => {
                if (currentTrayMode === 'laptop') {
                    return item.type === 'laptop';
                } else {
                    return item.type === 'other';
                }
            });
            
            // Create buttons for each item
            currentItems.forEach(item => {
                const button = document.createElement('button');
                button.className = 'item-button';
                button.setAttribute('data-id', item.id);
                
                // Use images instead of 3D models for preview
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                
                const span = document.createElement('span');
                span.textContent = item.name;
                
                button.appendChild(img);
                button.appendChild(span);
                
                // Add click event to add item to tray
                button.addEventListener('click', () => {
                    addItemToTray(item);
                });
                
                itemSelection.appendChild(button);
            });
        }
        
        // Add an item to the tray
        function addItemToTray(item) {
            // Create the item element
            const itemElement = document.createElement('div');
            itemElement.className = 'item-in-tray';
            itemElement.setAttribute('data-id', item.id);
            itemElement.setAttribute('data-type', item.type);
            
            // Set initial size
            itemElement.style.width = `${item.width}px`;
            itemElement.style.height = `${item.height}px`;
            
            // Add the image
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.name;
            itemElement.appendChild(img);
            
            // Position within tray
            const trayRect = trayOutline.getBoundingClientRect();
            const left = trayRect.left + (trayRect.width * (item.position.x / 100)) - (item.width / 2);
            const top = trayRect.top + (trayRect.height * (item.position.y / 100)) - (item.height / 2);
            
            itemElement.style.left = `${left}px`;
            itemElement.style.top = `${top}px`;
            
            // Make item draggable within tray
            makeItemDraggable(itemElement);
            
            // Add to DOM
            document.body.appendChild(itemElement);
            
            // Track item in the appropriate tray
            if (item.type === 'laptop') {
                itemsInTray.laptop.push(item);
            } else {
                itemsInTray.other.push(item);
            }
            
            // Check if we should show the next tray button
            updateNextTrayButton();
        }
        
        // Make an item draggable within the tray
        function makeItemDraggable(element) {
            let isDragging = false;
            let startX, startY;
            let offsetX = 0, offsetY = 0;
            
            element.addEventListener('touchstart', dragStart, { passive: false });
            element.addEventListener('touchmove', drag, { passive: false });
            element.addEventListener('touchend', dragEnd);
            
            // For desktop testing
            element.addEventListener('mousedown', dragStartMouse);
            document.addEventListener('mousemove', dragMouse);
            document.addEventListener('mouseup', dragEnd);
            
            function dragStart(e) {
                e.preventDefault();
                isDragging = true;
                
                startX = e.touches[0].clientX - offsetX;
                startY = e.touches[0].clientY - offsetY;
                
                element.style.zIndex = '30';
            }
            
            function dragStartMouse(e) {
                e.preventDefault();
                isDragging = true;
                
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
                
                element.style.zIndex = '30';
            }
            
            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                
                offsetX = e.touches[0].clientX - startX;
                offsetY = e.touches[0].clientY - startY;
                
                element.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }
            
            function dragMouse(e) {
                if (!isDragging) return;
                
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                
                element.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }
            
            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                
                // Ensure item stays within tray bounds
                const trayRect = trayOutline.getBoundingClientRect();
                const itemRect = element.getBoundingClientRect();
                
                // Calculate center position
                const centerX = itemRect.left + (itemRect.width / 2);
                const centerY = itemRect.top + (itemRect.height / 2);
                
                // Check if item is mostly in tray
                if (centerX < trayRect.left || centerX > trayRect.right || 
                    centerY < trayRect.top || centerY > trayRect.bottom) {
                    // Reset position if outside tray
                    offsetX = 0;
                    offsetY = 0;
                    element.style.transform = 'translate(0px, 0px)';
                }
                
                element.style.zIndex = '20';
            }
        }
        
        // Update visibility of next tray button
        function updateNextTrayButton() {
            if (currentTrayMode === 'other' && itemsInTray.other.length > 0) {
                nextTrayButton.style.display = 'block';
                nextTrayButton.textContent = 'Continue to Laptop Tray';
            } else if (currentTrayMode === 'laptop' && itemsInTray.laptop.length > 0) {
                nextTrayButton.style.display = 'block';
                nextTrayButton.textContent = 'Complete Security Check';
            } else {
                nextTrayButton.style.display = 'none';
            }
        }
        
        // Switch between tray modes
        function switchTrayMode() {
            if (currentTrayMode === 'other') {
                // Switch to laptop tray
                currentTrayMode = 'laptop';
                clearCurrentTrayItems();
                updateTrayModeDisplay();
                populateItemSelection();
                updateNextTrayButton();
            } else {
                // Complete the experience
                alert('Security check complete! All items have been properly placed.');
                resetExperience();
            }
        }
        
        // Clear items from the current tray
        function clearCurrentTrayItems() {
            // Remove elements from DOM
            document.querySelectorAll('.item-in-tray').forEach(item => {
                const type = item.getAttribute('data-type');
                if (type === currentTrayMode) {
                    item.remove();
                }
            });
        }
        
        // Reset the current tray
        function resetTray() {
            // Clear current tray only
            clearCurrentTrayItems();
            
            // Reset tracking for current tray type
            if (currentTrayMode === 'laptop') {
                itemsInTray.laptop = [];
            } else {
                itemsInTray.other = [];
            }
            
            updateNextTrayButton();
        }
        
        // Reset the entire experience
        function resetExperience() {
            // Clear all items
            document.querySelectorAll('.item-in-tray').forEach(item => {
                item.remove();
            });
            
            // Reset tracking
            itemsInTray.laptop = [];
            itemsInTray.other = [];
            
            // Start with other items tray
            currentTrayMode = 'other';
            updateTrayModeDisplay();
            populateItemSelection();
            updateNextTrayButton();
        }
        
        // Initialize the app when loaded
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
