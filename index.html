        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

            padding: 0;

            overflow-x: hidden;

        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            color: white;
            padding: 5px 15px;

        .back-button {

        .item-in-tray {

    <script>
        // Simple script to handle item placement
        document.addEventListener('DOMContentLoaded', function() {
            // Get all buttons
            const bagButton = document.getElementById('bagButton');
            const phoneButton = document.getElementById('phoneButton');
            const keysButton = document.getElementById('keysButton');
            const watchButton = document.getElementById('watchButton');
            const nextButton = document.getElementById('nextButton');
            const backButton = document.querySelector('.back-button');
            
            // Item placement tracking
            let itemsPlaced = {
                bag: true,
                phone: true,
                keys: true,
                watch: true
            };
            
            // Make items draggable
            const trayItems = document.querySelectorAll('.item-in-tray');
            trayItems.forEach(makeItemDraggable);
            
            // Button click handlers
            bagButton.addEventListener('click', function() {
                highlightItem('bag-in-tray');
            });
            
            phoneButton.addEventListener('click', function() {
                highlightItem('phone-in-tray-1');
                setTimeout(() => highlightItem('phone-in-tray-2'), 300);
            });
            
            keysButton.addEventListener('click', function() {
                highlightItem('keys-in-tray');
            });
            
            watchButton.addEventListener('click', function() {
                highlightItem('watch-in-tray');
            });
            
            nextButton.addEventListener('click', function() {
                alert('Switching to Laptop Tray...');
                // Change instruction text
                document.querySelector('.tray-type').textContent = 'Laptop Tray';
                
                // Clear existing items
                clearTray();
                
                // Change button text
                nextButton.textContent = 'Complete Security Check';
            });
            
            backButton.addEventListener('click', function() {
                location.reload();
            });
            
            // Highlight an item when its button is clicked
            function highlightItem(itemId) {
                const item = document.getElementById(itemId);
                if (item) {
                    item.style.boxShadow = '0 0 0 3px #34C759';
                    setTimeout(() => {
                        item.style.boxShadow = 'none';
                    }, 800);
                }
            }
            
            // Make items draggable
            function makeItemDraggable(element) {
                let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
                
                element.addEventListener('touchstart', dragStart, { passive: false });
                element.addEventListener('mousedown', dragStart);
                
                function dragStart(e) {
                    e.preventDefault();
                    
                    // Get initial positions
                    if (e.type === 'touchstart') {
                        pos3 = e.touches[0].clientX;
                        pos4 = e.touches[0].clientY;
                        
                        document.addEventListener('touchmove', dragMove, { passive: false });
                        document.addEventListener('touchend', dragEnd);
                    } else {
                        pos3 = e.clientX;
                        pos4 = e.clientY;
                        
                        document.addEventListener('mousemove', dragMove);
                        document.addEventListener('mouseup', dragEnd);
                    }
                    
                    // Bring to front
                    element.style.zIndex = '10';
                }
                
                function dragMove(e) {
                    e.preventDefault();
                    
                    // Calculate new positions
                    if (e.type === 'touchmove') {
                        pos1 = pos3 - e.touches[0].clientX;
                        pos2 = pos4 - e.touches[0].clientY;
                        pos3 = e.touches[0].clientX;
                        pos4 = e.touches[0].clientY;
                    } else {
                        pos1 = pos3 - e.clientX;
                        pos2 = pos4 - e.clientY;
                        pos3 = e.clientX;
                        pos4 = e.clientY;
                    }
                    
                    // Set new position
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                }
                
                function dragEnd() {
                    // Clean up event listeners
                    document.removeEventListener('mousemove', dragMove);
                    document.removeEventListener('mouseup', dragEnd);
                    document.removeEventListener('touchmove', dragMove);
                    document.removeEventListener('touchend', dragEnd);
                    
                    // Reset z-index
                    element.style.zIndex = '1';
                    
                    // Check if item is within bounds
                    keepInBounds(element);
                }
                
                // Keep element within tray bounds
                function keepInBounds(el) {
                    const tray = document.getElementById('trayOutline');
                    const trayRect = tray.getBoundingClientRect();
                    const elRect = el.getBoundingClientRect();
                    
                    // Check if element is outside tray
                    if (elRect.left < trayRect.left) {
                        el.style.left = '0px';
                    }
                    
                    if (elRect.right > trayRect.right) {
                        el.style.left = (trayRect.width - elRect.width) + 'px';
                    }
                    
                    if (elRect.top < trayRect.top) {
                        el.style.top = '0px';
                    }
                    
                    if (elRect.bottom > trayRect.bottom) {
                        el.style.top = (trayRect.height - elRect.height) + 'px';
                    }
                }
            }
            
            // Clear all items from tray
            function clearTray() {
                const trayItems = document.querySelectorAll('.item-in-tray');
                trayItems.forEach(item => {
                    item.style.display = 'none';
                });
            }
        });
    </script>
