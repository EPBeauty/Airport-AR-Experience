<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airport Security AR Guide</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-green: #34C759;
            --light-gray: #D9D9D9;
            --black: #000000;
            --white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            color: var(--black);
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: transparent;
        }
        
        .ar-button {
            background-color: var(--primary-green);
            color: var(--white);
            border-radius: 8px;
            border: none;
            position: absolute;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }
        
        .instructions-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            z-index: 100;
            text-align: center;
        }
        
        .instructions-panel h2 {
            margin-top: 0;
            color: var(--black);
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .instructions-panel p {
            color: var(--black);
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 400;
        }
        
        .item-selection {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.7);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            backdrop-filter: blur(5px);
        }
        
        .item-button {
            background-color: var(--white);
            border-radius: 10px;
            border: none;
            padding: 10px;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
        }
        
        .item-button img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        
        .item-button span {
            margin-top: 5px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .tray-mode {
            background-color: #34C759;
            color: white;
            border-radius: 20px;
            padding: 8px 16px;
            margin: 10px auto;
            display: inline-block;
            font-weight: 600;
        }
        
        .tray-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 40%;
            border: 3px dashed var(--primary-green);
            border-radius: 10px;
            z-index: 5;
            pointer-events: none;
        }
        
        .next-button {
            position: absolute;
            bottom: 120px;
            right: 20px;
            background-color: var(--primary-green);
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
        }
        
        .status-message {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(52, 199, 89, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            text-align: center;
            max-width: 80%;
        }
        
        .status-message.visible {
            opacity: 1;
        }
        
        /* Container for multiple 3D models */
        .models-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .ar-model {
            position: absolute;
            pointer-events: auto;
            width: 150px;
            height: 150px;
            z-index: 10;
        }
        
        /* Add a rotation control to models */
        .rotation-control {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 15;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Main AR viewer with camera only - no models -->
    <model-viewer
        id="arViewer"
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        interaction-prompt="none"
        shadow-intensity="1"
        environment-image="neutral">
        
        <button slot="ar-button" class="ar-button" id="arButton">
            Start AR Experience
        </button>
    </model-viewer>
    
    <!-- Container for multiple AR models -->
    <div class="models-container" id="modelsContainer"></div>
    
    <!-- Instruction panel -->
    <div class="instructions-panel">
        <h2>Place Items in Security Tray</h2>
        <div class="tray-mode" id="trayModeLabel">Regular Items Tray</div>
        <p>Tap items below to position in your real tray</p>

    <!-- Tray outline -->

    <!-- Next button -->
    <button class="next-button" id="nextButton" style="display: none;">
        Continue to Laptop Tray

    <!-- Status message -->

    <!-- Item selection -->

                },
                {

                    thumbnail: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWJhdHRlcnktY2hhcmdpbmciPjxwYXRoIGQ9Ik0yIDlhMiAyIDAgMCAxIDItMmgxM2EyIDIgMCAwIDEgMSA0aDJhMiAyIDAgMCAxIDAgNGgtMmEyIDIgMCAwIDEtMSA0SDRhMiAyIDAgMCAxLTItMnYtNloiLz48cGF0aCBkPSJNMTEgNiA3IDEyaDQgTCA3IDE4Ii8+PC9zdmc+'

                }
            ]
        };
        
        // ===== STATE MANAGEMENT =====
        // Track current tray mode and placed items
        let currentMode = 'regular';
        const placedItems = {
            regular: [],
            laptop: []
        };
        
        // ===== DOM REFERENCES =====
        const arViewer = document.getElementById('arViewer');
        const arButton = document.getElementById('arButton');
        const modelsContainer = document.getElementById('modelsContainer');
        const trayModeLabel = document.getElementById('trayModeLabel');
        const itemSelection = document.getElementById('itemSelection');
        const nextButton = document.getElementById('nextButton');
        const statusMessage = document.getElementById('statusMessage');
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize UI
            updateItemSelection();
            
            // Set up event listeners
            arViewer.addEventListener('ar-status', (event) => {
                if (event.detail.status === 'session-started') {
                    console.log('AR session started');
                    showStatusMessage('AR active! Tap items to place them in your tray');
                }
            });
            
            // Next button click
            nextButton.addEventListener('click', switchTrayMode);
        });
        
        // ===== UI FUNCTIONS =====
        // Update item selection based on current mode
        function updateItemSelection() {
            // Clear current buttons
            itemSelection.innerHTML = '';
            
            // Get items for current mode
            const currentItems = items[currentMode];
            
            // Create buttons for each item
            currentItems.forEach(item => {
                const button = document.createElement('button');
                button.className = 'item-button';
                button.addEventListener('click', () => placeItem(item));
                
                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.name;
                
                const span = document.createElement('span');
                span.textContent = item.name;
                
                button.appendChild(img);
                button.appendChild(span);
                
                itemSelection.appendChild(button);
            });
        }
        
        // Switch tray mode between regular and laptop
        function switchTrayMode() {
            if (currentMode === 'regular') {
                // Switch to laptop mode
                currentMode = 'laptop';
                trayModeLabel.textContent = 'Laptop Tray';
                nextButton.textContent = 'Complete Security Check';
                
                // Hide regular items
                const regularItemModels = document.querySelectorAll(`.ar-model[data-mode="regular"]`);
                regularItemModels.forEach(model => {
                    model.style.display = 'none';
                });
                
                // Update item selection
                updateItemSelection();
                
                // Hide next button until laptop is placed
                nextButton.style.display = 'none';
                
                // Show status message
                showStatusMessage('Place laptop in a separate tray');
            } else {
                // Complete security check
                showStatusMessage('Security check complete!');
                
                setTimeout(() => {
                    alert('Security check complete! All items have been properly arranged.');
                    location.reload(); // Refresh to start over
                }, 1500);
            }
        }
        
        // ===== AR FUNCTIONS =====
        // Place an item in AR
        function placeItem(item) {
            // Create a model-viewer for this item
            createModelViewer(item);
            
            // Show status message
            showStatusMessage(`Placing ${item.name}... Position in your tray`);
            
            // Show next button if at least one item is placed
            if (placedItems[currentMode].length === 0) {
                // This is the first item in this mode
                nextButton.style.display = 'block';
            }
            
            // Add to placed items
            placedItems[currentMode].push(item);
        }
        
        // Create a model-viewer for an item
        function createModelViewer(item) {
            // Create a container for this model
            const modelContainer = document.createElement('div');
            modelContainer.className = 'ar-model';
            modelContainer.setAttribute('data-id', item.id);
            modelContainer.setAttribute('data-mode', currentMode);
            
            // Create the model-viewer
            const modelViewer = document.createElement('model-viewer');
            modelViewer.src = item.model;
            modelViewer.setAttribute('scale', item.scale);
            modelViewer.setAttribute('ar', 'false');
            modelViewer.setAttribute('camera-controls', 'true');
            modelViewer.setAttribute('shadow-intensity', '1');
            modelViewer.setAttribute('environment-image', 'neutral');
            modelViewer.style.width = '100%';
            modelViewer.style.height = '100%';
            
            // Add a rotation control
            const rotationControl = document.createElement('div');
            rotationControl.className = 'rotation-control';
            rotationControl.innerHTML = '↻';
            rotationControl.addEventListener('click', () => {
                // Rotate the model 45 degrees
                const currentOrient = modelViewer.getAttribute('orientation') || '0deg 0deg 0deg';
                const orientValues = currentOrient.split(' ');
                const yRot = parseInt(orientValues[1]) || 0;
                const newYRot = (yRot + 45) % 360;
                orientValues[1] = `${newYRot}deg`;
                modelViewer.setAttribute('orientation', orientValues.join(' '));
            });
            
            // Add model-viewer to container
            modelContainer.appendChild(modelViewer);
            modelContainer.appendChild(rotationControl);
            
            // Position in center of tray initially
            const trayRect = document.querySelector('.tray-outline').getBoundingClientRect();
            const left = trayRect.left + (trayRect.width - 150) / 2;
            const top = trayRect.top + (trayRect.height - 150) / 2;
            
            modelContainer.style.left = `${left}px`;
            modelContainer.style.top = `${top}px`;
            
            // Make the model draggable
            makeDraggable(modelContainer, trayRect);
            
            // Add to DOM
            modelsContainer.appendChild(modelContainer);
            
            return modelContainer;
        }
        
        // Make an element draggable
        function makeDraggable(element, trayRect) {
            let isDragging = false;
            let startX, startY;
            let startLeft, startTop;
            
            // Add mouse/touch event listeners
            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', touchStart, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', touchMove, { passive: false });
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
            
            function touchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            }
            
            function dragStart(e) {
                if (e.target.className === 'rotation-control') return;
                startDrag(e.clientX, e.clientY);
            }
            
            function startDrag(x, y) {
                isDragging = true;
                startX = x;
                startY = y;
                startLeft = parseInt(element.style.left) || 0;
                startTop = parseInt(element.style.top) || 0;
                
                // Add dragging class
                element.classList.add('dragging');
                
                // Bring to front
                element.style.zIndex = '20';
            }
            
            function touchMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches[0];
                drag(touch.clientX, touch.clientY);
            }
            
            function dragMove(e) {
                if (!isDragging) return;
                drag(e.clientX, e.clientY);
            }
            
            function drag(x, y) {
                const dx = x - startX;
                const dy = y - startY;
                
                const newLeft = startLeft + dx;
                const newTop = startTop + dy;
                
                element.style.left = `${newLeft}px`;
                element.style.top = `${newTop}px`;
            }
            
            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                
                // Remove dragging class
                element.classList.remove('dragging');
                
                // Reset z-index
                element.style.zIndex = '10';
                
                // Check if model is in tray
                keepInTray();
            }
            
            function keepInTray() {
                // Get element dimensions
                const rect = element.getBoundingClientRect();
                
                // Get tray dimensions (passed as parameter)
                const trayLeft = trayRect.left;
                const trayRight = trayRect.right;
                const trayTop = trayRect.top;
                const trayBottom = trayRect.bottom;
                
                // Calculate center position of element
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                // Check if center is in tray
                const inTray = (
                    centerX >= trayLeft &&
                    centerX <= trayRight &&
                    centerY >= trayTop &&
                    centerY <= trayBottom
                );
                
                if (!inTray) {
                    // Move element back into tray
                    const newLeft = Math.max(trayLeft, Math.min(trayRight - rect.width, rect.left));
                    const newTop = Math.max(trayTop, Math.min(trayBottom - rect.height, rect.top));
                    
                    element.style.left = `${newLeft}px`;
                    element.style.top = `${newTop}px`;
                    
                    showStatusMessage('Keep items within the tray outline!');
                }
            }
        }
        
        // Show status message
        function showStatusMessage(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.classList.add('visible');
            
            setTimeout(() => {
                statusMessage.classList.remove('visible');
            }, duration);
        }
    </script>
</body>
</html>
