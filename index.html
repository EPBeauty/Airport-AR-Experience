<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Security AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        
        model-viewer {
            width: 100%;
            height: 85vh;
        }
        
        .tray-label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .button-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            padding: 10px;
            background: white;
        }
        
        .button {
            flex: 1;
            margin: 5px;
            padding: 15px 0;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }
        
        .active {
            background: #77ca64;
            color: white;
        }
        
        .inactive {
            background: white;
            color: #3991f8;
        }
    </style>
</head>
<body>
    <div class="tray-label" id="trayLabel">Laptop Tray</div>
    
    <model-viewer 
        id="model"
        src="laptop.glb"
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        shadow-intensity="1"
        auto-rotate>
    </model-viewer>
    
    <div class="button-bar">
        <button class="button active" id="laptopButton">Laptop</button>
        <button class="button inactive" id="otherButton">Other Items</button>
    </div>
    
    <script>
        const model = document.getElementById('model');
        const trayLabel = document.getElementById('trayLabel');
        const laptopButton = document.getElementById('laptopButton');
        const otherButton = document.getElementById('otherButton');
        
        // Current mode and other items index
        let currentMode = 'laptop';
        let otherItemIndex = 0;
        
        // Other item models
        const otherItems = [
            'phone.glb',
            'charger.glb',
            'keys.glb',
            'bag.glb',
            'hat.glb'
        ];
        
        // Button click handlers
        laptopButton.addEventListener('click', () => {
            currentMode = 'laptop';
            model.src = 'laptop.glb';
            trayLabel.textContent = 'Laptop Tray';
            
            laptopButton.className = 'button active';
            otherButton.className = 'button inactive';
        });
        
        otherButton.addEventListener('click', () => {
            currentMode = 'other';
            
            // Cycle through other items
            otherItemIndex = (otherItemIndex + 1) % otherItems.length;
            const itemName = otherItems[otherItemIndex].split('.')[0];
            
            model.src = otherItems[otherItemIndex];
            trayLabel.textContent = 'Other Items: ' + itemName.charAt(0).toUpperCase() + itemName.slice(1);
            
            laptopButton.className = 'button inactive';
            otherButton.className = 'button active';
        });
        
        // Handle model loading error
        model.addEventListener('error', function(event) {
            console.error('Error loading model:', event);
            alert('Error loading model. Please check file paths.');
        });
    </script>
</body>
</html>
