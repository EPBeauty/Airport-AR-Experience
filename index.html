        .feedback-message.visible {

        .draggable-item {
            position: absolute;
            z-index: 20;
            touch-action: none;
            transition: transform 0.15s ease;
            will-change: transform;
        }
        
        .draggable-item model-viewer {
            width: auto;
            height: auto;
            pointer-events: none; /* Prevents model-viewer from capturing events */
        }
        
        .draggable-item::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background-color: rgba(52, 199, 89, 0.3);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        
        .draggable-item.dragging::before {
            opacity: 1;
        }
        
        .next-tray-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            text-align: center;
            max-width: 80%;

            display: none;
        }
        
        .next-tray-message h2 {

            margin-top: 0;
            font-weight: 600;
        }
        
        .next-tray-button {
            background-color: var(--primary-green);

            border: none;
            border-radius: 8px;

            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px; /* Minimum touch target size */
        }
        
        /* Progress button that appears after placing items */

            cursor: pointer;
            z-index: 100;
            display: none;
            min-height: 44px; /* Minimum touch target size */
        }

        /* Item is being placed properly in tray */
        .in-tray {
            outline: 3px solid var(--primary-green) !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 15px rgba(52, 199, 89, 0.6) !important;
        }

        /* Item is being dragged */
        .dragging {
            opacity: 0.85;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        /* Grid system for tray */
        .tray-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 30%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5px;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .tray-grid.visible {
            opacity: 0.4;
        }
        
        .grid-cell {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }

            40% { transform: translate(2px, 0); }
