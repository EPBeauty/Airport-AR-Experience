<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airport Security AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* AR Viewer container */
        #ar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        
        /* Instruction card */
        .instruction-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border-radius: 15px;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        .instruction-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        
        .tray-label {
            background-color: #34C759;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            margin: 10px auto;
            display: inline-block;
            font-weight: bold;
        }
        
        .instruction-card p {
            margin: 10px 0 0 0;
        }
        
        /* Tray outline */
        .tray-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 40%;
            border: 3px dashed #34C759;
            border-radius: 10px;
            z-index: 5;
            pointer-events: none;
        }
        
        /* Item buttons */
        .item-selection {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            z-index: 100;
        }
        
        .item-button {
            background-color: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 70px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .item-icon {
            width: 40px;
            height: 40px;
            border: 1px solid #4a90e2;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a90e2;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .item-name {
            color: #4a90e2;
            font-weight: bold;
        }
        
        /* Next button */
        .next-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #34C759;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
        }
        
        /* Status message */
        .status-message {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #34C759;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        
        .status-message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- AR Container -->
    <div id="ar-container">
        <model-viewer
            id="arViewer"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            ar-scale="fixed"
            shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button" style="display: none;"></button>
        </model-viewer>
    </div>
    
    <!-- Tray outline -->
    <div class="tray-outline"></div>
    
    <!-- Instruction card -->
    <div class="instruction-card">
        <h2>Place Items in Security Tray</h2>
        <div class="tray-label">Regular Items Tray</div>
        <p>Tap items below to position in your real tray</p>
    </div>
    
    <!-- Item selection -->
    <div class="item-selection">
        <button class="item-button" onclick="placeItem('phone')">
            <div class="item-icon">?</div>
            <span class="item-name">Phone</span>
        </button>
        
        <button class="item-button" onclick="placeItem('bag')">
            <div class="item-icon">?</div>
            <span class="item-name">Bag</span>
        </button>
        
        <button class="item-button" onclick="placeItem('keys')">
            <div class="item-icon">?</div>
            <span class="item-name">Keys</span>
        </button>
        
        <button class="item-button" onclick="placeItem('hat')">
            <div class="item-icon">?</div>
            <span class="item-name">Hat</span>
        </button>
    </div>
    
    <!-- Next button -->
    <button class="next-button" onclick="switchToLaptopTray()">Continue to Laptop Tray</button>
    
    <!-- Status message -->
    <div class="status-message" id="statusMessage"></div>
    
    <script>
        // Wait for the document to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Start the AR experience immediately
            startAR();
        });
        
        // Start AR
        function startAR() {
            // Get the AR button and click it to start AR mode
            const arButton = document.getElementById('ar-button');
            if (arButton) {
                setTimeout(() => {
                    arButton.click();
                }, 1000);
            }
        }
        
        // Track placed items
        const placedItems = [];
        
        // Place an item in AR
        function placeItem(itemType) {
            const arViewer = document.getElementById('arViewer');
            
            // Show status message
            showStatusMessage(`Placing ${itemType}... Position in your tray`);
            
            // Set the 3D model source based on item type
            switch(itemType) {
                case 'phone':
                    arViewer.src = 'phone.glb';
                    arViewer.setAttribute('scale', '0.7 0.7 0.7');
                    break;
                case 'bag':
                    arViewer.src = 'bag.glb';
                    arViewer.setAttribute('scale', '1.3 1.3 1.3');
                    break;
                case 'keys':
                    arViewer.src = 'keys.glb';
                    arViewer.setAttribute('scale', '0.6 0.6 0.6');
                    break;
                case 'hat':
                    arViewer.src = 'hat.glb';
                    arViewer.setAttribute('scale', '0.9 0.9 0.9');
                    break;
                case 'laptop':
                    arViewer.src = 'laptop.glb';
                    arViewer.setAttribute('scale', '1.0 1.0 1.0');
                    break;
                default:
                    arViewer.src = 'phone.glb';
                    arViewer.setAttribute('scale', '0.7 0.7 0.7');
            }
            
            // Handle item placement
            arViewer.addEventListener('model-visibility', onModelPlaced);
            
            // Function to handle when model is placed
            function onModelPlaced(event) {
                if (event.detail.visible) {
                    // Remove the event listener to prevent multiple calls
                    arViewer.removeEventListener('model-visibility', onModelPlaced);
                    
                    // Track that the item was placed
                    placedItems.push(itemType);
                    
                    // Show success message
                    showStatusMessage(`${itemType.charAt(0).toUpperCase() + itemType.slice(1)} placed in tray!`);
                    
                    // Show next button if at least one item is placed
                    document.querySelector('.next-button').style.display = 'block';
                    
                    // Clear the model-viewer source to prepare for next item
                    setTimeout(() => {
                        arViewer.src = '';
                    }, 100);
                }
            }
        }
        
        // Switch to laptop tray
        function switchToLaptopTray() {
            // Change tray label
            document.querySelector('.tray-label').textContent = 'Laptop Tray';
            
            // Update instruction text
            document.querySelector('.instruction-card p').textContent = 'Place laptop in a separate tray';
            
            // Update item buttons - show only laptop
            document.querySelector('.item-selection').innerHTML = `
                <button class="item-button" onclick="placeItem('laptop')">
                    <div class="item-icon">?</div>
                    <span class="item-name">Laptop</span>
                </button>
            `;
            
            // Update next button
            const nextButton = document.querySelector('.next-button');
            nextButton.textContent = 'Complete Security Check';
            nextButton.onclick = completeSecurityCheck;
            nextButton.style.display = 'none';
            
            // Show status message
            showStatusMessage('Place laptop in a separate tray');
        }
        
        // Complete the security check
        function completeSecurityCheck() {
            alert('Security check complete! All items have been properly arranged.');
            window.location.reload(); // Reload the page to start over
        }
        
        // Show status message
        function showStatusMessage(message) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.classList.add('visible');
            
            // Hide after 3 seconds
            setTimeout(() => {
                statusMessage.classList.remove('visible');
            }, 3000);
        }
    </script>
</body>
</html>
