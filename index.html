<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Security AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        model-viewer {
            width: 100%;
            height: 85vh;
        }
        
        .tray-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 10;
        }
        
        .button-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background-color: white;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            border-top: 1px solid #ddd;
        }
        
        .nav-button {
            flex: 1;
            margin: 0 10px;
            padding: 12px;
            border-radius: 30px;
            border: none;
            background-color: white;
            color: #3991f8;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav-button.active {
            background-color: #77ca64;
            color: white;
        }
    </style>
</head>
<body>
    <div class="tray-info" id="trayInfo">Laptop Tray</div>
    
    <model-viewer 
        id="arViewer"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        ar-scale="fixed"
        auto-rotate>
    </model-viewer>
    
    <div class="button-bar">
        <button class="nav-button active" id="laptopButton">Laptop</button>
        <button class="nav-button" id="otherButton">Other Items</button>
    </div>
    
    <script>
        // DOM Elements
        const arViewer = document.getElementById('arViewer');
        const trayInfo = document.getElementById('trayInfo');
        const laptopButton = document.getElementById('laptopButton');
        const otherButton = document.getElementById('otherButton');
        
        // Available 3D models
        const models = {
            laptop: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
            other: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb'
        };
        
        // Handle button clicks
        laptopButton.addEventListener('click', () => {
            switchMode('laptop');
        });
        
        otherButton.addEventListener('click', () => {
            switchMode('other');
        });
        
        // Switch between modes
        function switchMode(mode) {
            // Update UI
            laptopButton.classList.remove('active');
            otherButton.classList.remove('active');
            
            if (mode === 'laptop') {
                laptopButton.classList.add('active');
                trayInfo.textContent = 'Laptop Tray';
                arViewer.src = models.laptop;
            } else {
                otherButton.classList.add('active');
                trayInfo.textContent = 'Other Items Tray';
                arViewer.src = models.other;
            }
        }
    </script>
</body>
</html>
